<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十城市天气实况 · 天气查询</title>
<style>
  :root {
    --bg-1: #eef5fd;
    --bg-2: #dfeaf9;
    --card-bg: linear-gradient(160deg, #f2f8ff 0%, #d9ebff 55%, #e8f3ff 100%);
    --card-line: rgba(61, 126, 255, .16);
    --text-main: #1b3a5c;
    --text-sub: #5b7a9e;
    --accent: #3d7eff;
    --shadow: 0 6px 22px rgba(61, 126, 255, .10);
    --shadow-hover: 0 14px 34px rgba(61, 126, 255, .20);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 40px 20px 32px;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text-main);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2));
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 1180px; margin: 0 auto; }

  /* ---------- 顶部标题区 ---------- */
  .header {
    text-align: center;
    margin-bottom: 26px;
  }

  .header h1 {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #12385c;
  }

  .header p {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-sub);
  }

  .meta-row {
    margin-top: 16px;
    display: flex;
    justify-content: center;
  }

  .time-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    font-size: 12.5px;
    font-weight: 500;
    color: #2b5c94;
    background: rgba(61, 126, 255, .10);
    border: 1px solid rgba(61, 126, 255, .24);
    border-radius: 999px;
    letter-spacing: .3px;
  }

  .time-badge b { font-weight: 600; }

  .time-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(61, 126, 255, .18);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.82); }
  }

  /* ---------- 卡片网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 18px;
    padding: 20px 20px 16px;
    box-shadow: var(--shadow);
    transition: transform .26s ease, box-shadow .26s ease;
    opacity: 0;
    animation: cardIn .5s ease forwards;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 卡片头部：城市名 + 天气图标 */
  .c-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .c-city {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #12385c;
  }

  .c-cond {
    margin-top: 7px;
    font-size: 13px;
    color: #3d6f9e;
  }

  .c-temp {
    margin-top: 12px;
    font-size: 34px;
    font-weight: 300;
    line-height: 1;
    color: #12385c;
  }

  .c-temp span {
    font-size: 15px;
    font-weight: 400;
    vertical-align: top;
    margin-left: 2px;
  }

  .c-icon {
    flex: 0 0 auto;
    font-size: 38px;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 3px 10px rgba(61, 126, 255, .22);
  }

  /* 温度迷你条 */
  .c-bar {
    margin-top: 9px;
    height: 5px;
    border-radius: 999px;
    background: rgba(61, 126, 255, .14);
    overflow: hidden;
  }

  .c-bar i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #7fb2ff, #3d7eff);
  }

  /* 详情三栏 */
  .c-detail {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--card-line);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .c-item { text-align: center; }

  .c-item .label {
    font-size: 11.5px;
    color: var(--text-sub);
    letter-spacing: .4px;
  }

  .c-item .value {
    margin-top: 7px;
    font-size: 14px;
    font-weight: 600;
    color: #1b3a5c;
  }

  .c-item .value small {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-sub);
    margin-left: 1px;
  }

  /* 空气质量徽章 */
  .aqi-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .aqi-优      { color: #12724a; background: rgba(34, 160, 107, .16); }
  .aqi-良      { color: #8a6300; background: rgba(226, 176, 5, .20); }
  .aqi-轻度污染 { color: #9a4a00; background: rgba(240, 138, 24, .20); }
  .aqi-中度污染 { color: #9c2222; background: rgba(226, 70, 70, .18); }
  .aqi-重度污染 { color: #6c1f7a; background: rgba(150, 60, 190, .18); }
  .aqi-严重污染 { color: #6b1414; background: rgba(130, 25, 25, .20); }

  /* ---------- 底部说明 ---------- */
  .footer-note {
    margin-top: 30px;
    text-align: center;
    font-size: 12px;
    color: #7b93ad;
    letter-spacing: .3px;
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 560px) {
    body { padding: 26px 14px 24px; }
    .header h1 { font-size: 22px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .c-temp { font-size: 30px; }
    .c-icon { font-size: 34px; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <h1>🌤️ 十城市天气实况</h1>
    <p>全国主要城市实时天气概览</p>
    <div class="meta-row">
      <span class="time-badge"><i class="dot"></i>数据获取时间：<b id="dataTime">—</b></span>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <p class="footer-note">数据来源：腾讯位置服务MCP Server</p>

</div>

<script>
/* ============================================================
   城市天气数据（10 个城市）
   cond 天气状况 | temp 温度(℃) | humidity 湿度(%)
   wind 风力 | aqi 空气质量指数 | aqiLevel 等级
   ============================================================ */
const DATA_UPDATED_AT = "2026-10-12 12:35";

const CITY_WEATHER = [
  { city: "北京", cond: "多云转阴",   temp: 19, humidity: 86, wind: "北风 2-3 级",   aqi: 133, aqiLevel: "轻度污染" },
  { city: "上海", cond: "多云",       temp: 23, humidity: 71, wind: "西北风 2-3 级", aqi: 40,  aqiLevel: "优" },
  { city: "广州", cond: "晴间多云",   temp: 31, humidity: 58, wind: "东南风 3 级",   aqi: 52,  aqiLevel: "良" },
  { city: "深圳", cond: "晴天间多云", temp: 29, humidity: 67, wind: "东风 3 级",     aqi: 28,  aqiLevel: "优" },
  { city: "成都", cond: "多云",       temp: 19, humidity: 95, wind: "北风 2 级",     aqi: 25,  aqiLevel: "优" },
  { city: "杭州", cond: "晴",         temp: 24, humidity: 89, wind: "西风 1-2 级",   aqi: 90,  aqiLevel: "良" },
  { city: "武汉", cond: "晴",         temp: 26, humidity: 69, wind: "东南风 2-3 级", aqi: 105, aqiLevel: "轻度污染" },
  { city: "西安", cond: "小雨转阴",   temp: 17, humidity: 97, wind: "西风 2-3 级",   aqi: 55,  aqiLevel: "良" },
  { city: "南京", cond: "晴",         temp: 24, humidity: 89, wind: "东北风 2 级",   aqi: 35,  aqiLevel: "优" },
  { city: "重庆", cond: "阴",         temp: 23, humidity: 83, wind: "西风 2 级",     aqi: 54,  aqiLevel: "良" }
];

/* ============================================================
   天气图标映射：雨 → ☂，晴 → ☀，其余 → ☁
   判断顺序先雨后晴，「阵雨」「小雨」都能落到 ☂
   ============================================================ */
function getWeatherIcon(cond) {
  if (cond.indexOf("雨") !== -1) return "☂";
  if (cond.indexOf("晴") !== -1) return "☀";
  return "☁";
}

/* AQI 等级 → 徽章配色 */
const AQI_CLASS_MAP = {
  "优": "aqi-优",
  "良": "aqi-良",
  "轻度污染": "aqi-轻度污染",
  "中度污染": "aqi-中度污染",
  "重度污染": "aqi-重度污染",
  "严重污染": "aqi-严重污染"
};

/* 温度迷你条：15℃ 为 0%，35℃ 为 100% */
function tempPercent(temp) {
  const p = ((temp - 15) / 20) * 100;
  return Math.max(6, Math.min(100, p));
}

/* 生成单张卡片 */
function cardHTML(d, index) {
  const aqiClass = AQI_CLASS_MAP[d.aqiLevel] || "aqi-良";
  const icon = getWeatherIcon(d.cond);

  return `
    <article class="card" style="animation-delay:${index * 55}ms">
      <div class="c-top">
        <div>
          <div class="c-city">${d.city}</div>
          <div class="c-cond">${d.cond}</div>
        </div>
        <div class="c-icon" title="${d.cond}">${icon}</div>
      </div>

      <div class="c-temp">${d.temp}<span>℃</span></div>
      <div class="c-bar"><i style="width:${tempPercent(d.temp)}%"></i></div>

      <div class="c-detail">
        <div class="c-item">
          <div class="label">湿度</div>
          <div class="value">${d.humidity}<small>%</small></div>
        </div>
        <div class="c-item">
          <div class="label">风力</div>
          <div class="value">${d.wind}</div>
        </div>
        <div class="c-item">
          <div class="label">空气质量</div>
          <div class="value"><span class="aqi-badge ${aqiClass}">${d.aqiLevel} ${d.aqi}</span></div>
        </div>
      </div>
    </article>
  `;
}

/* 渲染整页 */
function render() {
  document.getElementById("dataTime").textContent = DATA_UPDATED_AT;
  document.getElementById("grid").innerHTML = CITY_WEATHER.map(cardHTML).join("");
}

render();
</script>
</body>
</html>
