<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单摆谐振动仿真 · Week 05</title>
<style>
  :root {
    --bg: #1a1a24;
    --panel: rgba(26, 26, 36, 0.82);
    --line: rgba(120, 200, 255, 0.14);
    --accent: #5ec8ff;
    --accent-soft: rgba(94, 200, 255, 0.55);
    --text: #e8f4ff;
    --muted: #8a93a6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    overflow: hidden;
  }

  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* ---------- 控制面板 ---------- */
  .panel {
    position: fixed;
    top: 24px;
    left: 24px;
    width: 272px;
    padding: 18px 18px 16px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    user-select: none;
  }

  .panel h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .panel .sub {
    margin: 6px 0 14px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 10px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .metrics div { display: flex; flex-direction: column; gap: 3px; }
  .metrics span { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  .metrics b {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }

  .row { display: flex; flex-direction: column; gap: 6px; }
  .row .head {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .row .head b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-soft), rgba(255, 255, 255, 0.08));
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0e2534;
    box-shadow: 0 0 10px var(--accent-soft);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: 2px solid #0e2534;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-soft);
  }

  .actions { display: flex; gap: 8px; margin-top: 16px; }

  button {
    flex: 1;
    padding: 8px 10px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text);
    background: rgba(94, 200, 255, 0.10);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
  }
  button:hover { background: rgba(94, 200, 255, 0.20); border-color: var(--accent-soft); }
  button:active { transform: translateY(1px); }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    margin: 0;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    white-space: nowrap;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    .panel { left: 12px; right: 12px; top: 12px; width: auto; padding: 14px; }
    .panel h1 { font-size: 15px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="单摆谐振动仿真画面"></canvas>

<section class="panel">
  <h1>单摆谐振动仿真</h1>
  <p class="sub">WEEK 05 · CANVAS · requestAnimationFrame</p>

  <div class="metrics">
    <div><span>摆长 L</span><b id="mL">200 px</b></div>
    <div><span>重力 g</span><b id="mG">9.8 m/s²</b></div>
    <div><span>摆角 θ</span><b id="mA">45.0°</b></div>
    <div><span>理论周期 T</span><b id="mT">2.84 s</b></div>
  </div>

  <div class="controls">
    <div class="row">
      <div class="head"><span>摆长 L</span><b id="oL">200 px</b></div>
      <input id="sL" type="range" min="120" max="340" step="1" value="200" />
    </div>
    <div class="row">
      <div class="head"><span>重力 g</span><b id="oG">9.8 m/s²</b></div>
      <input id="sG" type="range" min="1.6" max="24" step="0.1" value="9.8" />
    </div>
    <div class="row">
      <div class="head"><span>阻尼系数</span><b id="oD">0.000</b></div>
      <input id="sD" type="range" min="0" max="0.3" step="0.005" value="0" />
    </div>
  </div>

  <div class="actions">
    <button id="btnPlay" type="button">暂停</button>
    <button id="btnReset" type="button">重置</button>
  </div>
</section>

<p class="hint">拖动摆球改变摆角 · 空格暂停 / 继续 · R 重置</p>

<script>
(function () {
  'use strict';

  /* ======================= 基础配置 ======================= */
  var COLOR_BG      = '#1a1a24';
  var COLOR_ACCENT  = '94, 200, 255';   // rgb 分量，便于拼 rgba
  var PX_PER_METER  = 100;              // 单位换算：1 米 = 100 像素

  var INIT = {
    L: 200,          // 摆长（像素）
    g: 9.8,          // 重力加速度（m/s²）
    angleDeg: 45,    // 初始摆角（度）
    damping: 0       // 阻尼系数，0 表示理想简谐振动
  };

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  /* ======================= 物理状态 ======================= */
  var L = INIT.L;                    // 摆长，像素
  var g = INIT.g;                    // 重力加速度
  var damping = INIT.damping;        // 阻尼
  var theta = INIT.angleDeg * Math.PI / 180;  // 摆角（弧度，0 为竖直向下）
  var omega = 0;                     // 角速度（rad/s）
  var running = true;
  var dragging = false;

  var trail = [];                    // 摆球轨迹
  var TRAIL_MAX = 170;

  /* ======================= 画布尺寸 ======================= */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* 悬挂点：让摆长总能完整落在画面内 */
  function pivot() {
    var py = Math.min(150, Math.max(70, H - L - 96));
    return { x: W / 2, y: py };
  }

  /* ======================= 物理计算 ======================= */
  /* θ'' = -(g/L)·sinθ - c·θ'   （L 换算成米） */
  function deriv(th, om) {
    var Lm = L / PX_PER_METER;
    return [om, -(g / Lm) * Math.sin(th) - damping * om];
  }

  /* 四阶龙格-库塔积分，固定步长，保证长时间运行的数值稳定 */
  function stepRK4(dt) {
    var k1 = deriv(theta, omega);
    var k2 = deriv(theta + 0.5 * dt * k1[0], omega + 0.5 * dt * k1[1]);
    var k3 = deriv(theta + 0.5 * dt * k2[0], omega + 0.5 * dt * k2[1]);
    var k4 = deriv(theta + dt * k3[0], omega + dt * k3[1]);

    theta += dt / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    omega += dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
  }

  /* ======================= 绘制 ======================= */
  function drawBackground() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, W, H);

    // 细网格：营造科技底纹
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.032)';
    ctx.lineWidth = 1;
    var gap = 44;
    ctx.beginPath();
    for (var x = (W % gap) / 2; x < W; x += gap) {
      ctx.moveTo(Math.round(x) + 0.5, 0);
      ctx.lineTo(Math.round(x) + 0.5, H);
    }
    for (var y = (H % gap) / 2; y < H; y += gap) {
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(W, Math.round(y) + 0.5);
    }
    ctx.stroke();

    // 中心暗角，把注意力收拢到摆球上
    var vig = ctx.createRadialGradient(W / 2, H * 0.42, 40, W / 2, H * 0.42, Math.max(W, H) * 0.72);
    vig.addColorStop(0, 'rgba(26, 26, 36, 0)');
    vig.addColorStop(1, 'rgba(8, 8, 14, 0.72)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  /* 摆角量程参考弧（虚线） */
  function drawGuideArc(px, py) {
    var span = 62 * Math.PI / 180;
    ctx.save();
    ctx.strokeStyle = 'rgba(' + COLOR_ACCENT + ', 0.16)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.arc(px, py, L, -Math.PI / 2 - span, -Math.PI / 2 + span);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round';
    for (var i = 1; i < trail.length; i++) {
      var p = trail[i - 1], q = trail[i];
      var t = i / trail.length;             // 越新越亮
      ctx.strokeStyle = 'rgba(' + COLOR_ACCENT + ', ' + (0.28 * t) + ')';
      ctx.lineWidth = 1 + 1.6 * t;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(q.x, q.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRod(px, py, bx, by) {
    var grad = ctx.createLinearGradient(px, py, bx, by);
    grad.addColorStop(0, 'rgba(200, 225, 245, 0.42)');
    grad.addColorStop(1, 'rgba(' + COLOR_ACCENT + ', 0.92)');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }

  function drawPivot(px, py) {
    ctx.save();
    ctx.shadowColor = 'rgba(' + COLOR_ACCENT + ', 0.7)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(' + COLOR_ACCENT + ', 0.85)';
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(' + COLOR_ACCENT + ', 0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, 11, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawBob(bx, by) {
    var r = 15;

    // 外层柔光晕
    var halo = ctx.createRadialGradient(bx, by, r * 0.4, bx, by, r * 3.4);
    halo.addColorStop(0, 'rgba(' + COLOR_ACCENT + ', 0.30)');
    halo.addColorStop(0.45, 'rgba(' + COLOR_ACCENT + ', 0.10)');
    halo.addColorStop(1, 'rgba(' + COLOR_ACCENT + ', 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(bx, by, r * 3.4, 0, Math.PI * 2);
    ctx.fill();

    // 球体本身：高光偏移，制造玻璃质感
    ctx.save();
    ctx.shadowColor = 'rgba(' + COLOR_ACCENT + ', 0.85)';
    ctx.shadowBlur = 22;
    var body = ctx.createRadialGradient(bx - r * 0.35, by - r * 0.4, r * 0.15, bx, by, r);
    body.addColorStop(0, '#f2fdff');
    body.addColorStop(0.42, '#a8e8ff');
    body.addColorStop(1, '#2b86c4');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 边缘细描边，强化轮廓
    ctx.strokeStyle = 'rgba(230, 250, 255, 0.65)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(bx, by, r - 0.4, 0, Math.PI * 2);
    ctx.stroke();

    // 小高光点
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(bx - r * 0.34, by - r * 0.4, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 摆角标注：从竖直线到摆杆的小圆弧 */
  function drawAngleLabel(px, py, bx, by) {
    if (Math.abs(theta) < 0.03) return;
    var a = Math.PI / 2 - theta;   // 画布角度：竖直向下为 π/2
    var rr = 54;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, rr, Math.PI / 2, a, theta > 0);
    ctx.stroke();

    ctx.fillStyle = 'rgba(200, 225, 245, 0.72)';
    ctx.font = '12px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var midA = (Math.PI / 2 + a) / 2;
    ctx.fillText(
      Math.abs(theta * 180 / Math.PI).toFixed(1) + '°',
      px + Math.cos(midA) * (rr + 20),
      py + Math.sin(midA) * (rr + 20)
    );
    ctx.restore();
  }

  function render() {
    var p = pivot();
    var bx = p.x + L * Math.sin(theta);
    var by = p.y + L * Math.cos(theta);

    drawBackground();
    drawGuideArc(p.x, p.y);
    drawTrail();
    drawRod(p.x, p.y, bx, by);
    drawPivot(p.x, p.y);
    drawAngleLabel(p.x, p.y, bx, by);
    drawBob(bx, by);

    // 记录轨迹（暂停 / 拖拽时不再追加）
    if (running && !dragging) {
      trail.push({ x: bx, y: by });
      if (trail.length > TRAIL_MAX) trail.shift();
    }
  }

  /* ======================= 主循环 ======================= */
  var STEP = 1 / 240;      // 物理固定步长：240 Hz
  var acc = 0;
  var last = performance.now();
  var frame = 0;

  function loop(now) {
    var dtReal = (now - last) / 1000;
    last = now;
    if (dtReal > 0.05) dtReal = 0.05;   // 切后台回来时防止"瞬移"

    if (running && !dragging) {
      acc += dtReal;
      while (acc >= STEP) {
        stepRK4(STEP);
        acc -= STEP;
      }
    } else {
      acc = 0;
    }

    render();

    // 摆角读数随动画刷新（不必每帧写 DOM）
    if (++frame % 6 === 0) {
      mA.textContent = (theta * 180 / Math.PI).toFixed(1) + '°';
    }

    requestAnimationFrame(loop);
  }

  /* ======================= 面板交互 ======================= */
  var mL = document.getElementById('mL');
  var mG = document.getElementById('mG');
  var mA = document.getElementById('mA');
  var mT = document.getElementById('mT');
  var oL = document.getElementById('oL');
  var oG = document.getElementById('oG');
  var oD = document.getElementById('oD');
  var sL = document.getElementById('sL');
  var sG = document.getElementById('sG');
  var sD = document.getElementById('sD');
  var btnPlay = document.getElementById('btnPlay');
  var btnReset = document.getElementById('btnReset');

  function refreshMetrics() {
    mL.textContent = L + ' px';
    mG.textContent = g.toFixed(1) + ' m/s²';
    mA.textContent = (theta * 180 / Math.PI).toFixed(1) + '°';
    var Lm = L / PX_PER_METER;
    mT.textContent = (2 * Math.PI * Math.sqrt(Lm / g)).toFixed(2) + ' s';
  }

  sL.addEventListener('input', function () {
    L = Number(sL.value);
    oL.textContent = L + ' px';
    trail.length = 0;
    refreshMetrics();
  });

  sG.addEventListener('input', function () {
    g = Number(sG.value);
    oG.textContent = g.toFixed(1) + ' m/s²';
    refreshMetrics();
  });

  sD.addEventListener('input', function () {
    damping = Number(sD.value);
    oD.textContent = damping.toFixed(3);
  });

  btnPlay.addEventListener('click', function () {
    running = !running;
    acc = 0;
    btnPlay.textContent = running ? '暂停' : '继续';
  });

  btnReset.addEventListener('click', function () {
    theta = INIT.angleDeg * Math.PI / 180;
    omega = 0;
    trail.length = 0;
    acc = 0;
    if (!running) {
      running = true;
      btnPlay.textContent = '暂停';
    }
    refreshMetrics();
  });

  /* ======================= 拖拽改变摆角 ======================= */
  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function bobPos() {
    var p = pivot();
    return { x: p.x + L * Math.sin(theta), y: p.y + L * Math.cos(theta) };
  }

  canvas.addEventListener('pointerdown', function (e) {
    var m = pointerPos(e);
    var b = bobPos();
    if (Math.hypot(m.x - b.x, m.y - b.y) <= 34) {
      dragging = true;
      canvas.setPointerCapture(e.pointerId);
      trail.length = 0;
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    var m = pointerPos(e);
    var b = bobPos();
    canvas.style.cursor = dragging
      ? 'grabbing'
      : (Math.hypot(m.x - b.x, m.y - b.y) <= 34 ? 'grab' : 'default');

    if (!dragging) return;
    var p = pivot();
    var dx = m.x - p.x;
    var dy = Math.max(m.y - p.y, 1);
    var a = Math.atan2(dx, dy);
    var limit = 84 * Math.PI / 180;
    theta = Math.max(-limit, Math.min(limit, a));
    omega = 0;
    refreshMetrics();
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    omega = 0;
    acc = 0;
    if (e && e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
    canvas.style.cursor = 'default';
  }

  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      btnPlay.click();
    } else if (e.key === 'r' || e.key === 'R') {
      btnReset.click();
    }
  });

  window.addEventListener('resize', resize);

  /* ======================= 启动 ======================= */
  resize();
  oL.textContent = L + ' px';
  oG.textContent = g.toFixed(1) + ' m/s²';
  oD.textContent = damping.toFixed(3);
  refreshMetrics();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
