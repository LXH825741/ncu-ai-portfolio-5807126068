<!DOCTYPE html>
<!-- ============================================================
     实验一 · 静态数据版天气查询网页
     说明：原文件在实验二、实验三中被原地修改覆盖，本文件依据当时的
           修改记录反向还原（属于还原版，非磁盘上的原始字节）。
     特征：下拉框选择单个城市 + 查询按钮，数据全部硬编码为演示数据。
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气查询工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #eef2f7;
    --card-bg: #ffffff;
    --text-main: #1f2d3d;
    --text-sub: #7b8794;
    --line: #e4e9f0;
    --accent: #3d7eff;
    --accent-dark: #2b64d6;
    --shadow: 0 8px 30px rgba(31, 45, 61, 0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #eef4ff 0%, #e6edf7 45%, #eef2f7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    color: var(--text-main);
  }

  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- 标题 ---------- */
  .header { text-align: center; }

  .header h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .header p {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-sub);
  }

  /* ---------- 查询面板 ---------- */
  .panel {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .select-wrap {
    position: relative;
    flex: 1 1 180px;
  }

  .select-wrap::after {
    content: "";
    position: absolute;
    right: 16px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--text-sub);
    border-bottom: 2px solid var(--text-sub);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    padding: 13px 40px 13px 16px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-main);
    background: #f7f9fc;
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
  }

  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61, 126, 255, .14);
  }

  button {
    flex: 0 0 auto;
    padding: 13px 30px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, #4d88ff, #2b64d6);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, filter .2s;
    box-shadow: 0 6px 16px rgba(61, 126, 255, .28);
  }

  button:hover { filter: brightness(1.05); box-shadow: 0 8px 20px rgba(61, 126, 255, .35); }
  button:active { transform: translateY(1px) scale(.99); }

  /* ---------- 结果区 ---------- */
  .result {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events: none;
  }

  .result.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .weather-card {
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .wc-top {
    padding: 26px 24px 22px;
    background: linear-gradient(135deg, #3d7eff, #5b9bff);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .wc-city {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .wc-cond {
    margin-top: 8px;
    font-size: 14px;
    opacity: .92;
  }

  .wc-temp-desc {
    margin-top: 14px;
    font-size: 12px;
    opacity: .8;
  }

  .wc-right {
    text-align: right;
    flex: 0 0 auto;
  }

  .wc-icon { font-size: 46px; line-height: 1; }

  .wc-temp {
    font-size: 42px;
    font-weight: 300;
    line-height: 1.1;
    margin-top: 4px;
  }

  .wc-temp span { font-size: 20px; vertical-align: top; }

  /* ---------- 详情网格 ---------- */
  .wc-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
  }

  .wc-item {
    padding: 18px 12px;
    text-align: center;
    border-right: 1px solid var(--line);
  }

  .wc-item:last-child { border-right: none; }

  .wc-item .label {
    font-size: 12px;
    color: var(--text-sub);
    letter-spacing: .5px;
  }

  .wc-item .value {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 600;
  }

  .wc-item .value small { font-size: 12px; font-weight: 400; color: var(--text-sub); margin-left: 2px; }

  .badge {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 20px;
  }

  /* AQI 等级配色 */
  .aqi-优    { background: #e5f7ec; color: #1f9d55; }
  .aqi-良    { background: #fdf6dd; color: #b8901a; }
  .aqi-轻度污染 { background: #fdeee2; color: #d97706; }
  .aqi-中度污染 { background: #fde6e0; color: #dc5a3c; }
  .aqi-重度污染 { background: #f6e3ef; color: #a4388c; }

  /* ---------- 空状态 / 提示 ---------- */
  .empty, .tip {
    text-align: center;
    padding: 34px 20px;
    background: var(--card-bg);
    border-radius: 16px;
    color: var(--text-sub);
    font-size: 14px;
    box-shadow: var(--shadow);
  }

  .empty .icon { font-size: 34px; display: block; margin-bottom: 10px; opacity: .6; }

  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 420px) {
    .wc-top { flex-direction: column; align-items: flex-start; }
    .wc-right { text-align: left; display: flex; align-items: center; gap: 14px; }
    .wc-icon { font-size: 38px; }
    .wc-temp { margin-top: 0; font-size: 36px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>☁️ 天气查询</h1>
    <p>选择城市，查看当前天气状况</p>
  </div>

  <div class="panel">
    <div class="select-wrap">
      <select id="citySelect">
        <option value="">请选择城市</option>
        <option value="北京">北京</option>
        <option value="上海">上海</option>
        <option value="广州">广州</option>
        <option value="深圳">深圳</option>
        <option value="成都">成都</option>
        <option value="杭州">杭州</option>
        <option value="武汉">武汉</option>
        <option value="西安">西安</option>
        <option value="南京">南京</option>
        <option value="重庆">重庆</option>
      </select>
    </div>
    <button id="queryBtn">查询天气</button>
  </div>

  <div id="output"></div>
</div>

<script>
/* ============================================================
   静态天气数据（硬编码，不调用任何外部 API）
   cond: 天气状况 | icon: 天气图标 | temp: 温度(℃) | humidity: 湿度(%)
   wind: 风力 | aqi: 空气质量指数 | aqiLevel: 等级
   ============================================================ */
const WEATHER_DATA = {
  "北京": { cond: "晴",       icon: "☀️",  temp: 21, humidity: 38, wind: "西北风 3 级", aqi: 62,  aqiLevel: "良" },
  "上海": { cond: "多云",     icon: "⛅",  temp: 24, humidity: 68, wind: "东南风 2 级", aqi: 45,  aqiLevel: "优" },
  "广州": { cond: "小雨",     icon: "🌧️", temp: 27, humidity: 85, wind: "南风 2 级",   aqi: 38,  aqiLevel: "优" },
  "深圳": { cond: "阴",       icon: "☁️",  temp: 28, humidity: 78, wind: "东南风 3 级", aqi: 41,  aqiLevel: "优" },
  "成都": { cond: "小雨",     icon: "🌧️", temp: 19, humidity: 82, wind: "东北风 1 级", aqi: 74,  aqiLevel: "良" },
  "杭州": { cond: "晴转多云", icon: "🌤️", temp: 23, humidity: 60, wind: "东风 2 级",   aqi: 52,  aqiLevel: "良" },
  "武汉": { cond: "多云",     icon: "⛅",  temp: 22, humidity: 65, wind: "北风 3 级",   aqi: 88,  aqiLevel: "良" },
  "西安": { cond: "扬沙",     icon: "🌫️", temp: 18, humidity: 30, wind: "西北风 4 级", aqi: 156, aqiLevel: "中度污染" },
  "南京": { cond: "阵雨",     icon: "🌦️", temp: 23, humidity: 74, wind: "东南风 2 级", aqi: 66,  aqiLevel: "良" },
  "重庆": { cond: "阴",       icon: "☁️",  temp: 20, humidity: 80, wind: "西南风 1 级", aqi: 95,  aqiLevel: "良" }
};

/* AQI 等级 → 样式类名映射（用于徽章配色） */
const AQI_CLASS_MAP = {
  "优": "aqi-优",
  "良": "aqi-良",
  "轻度污染": "aqi-轻度污染",
  "中度污染": "aqi-中度污染",
  "重度污染": "aqi-重度污染"
};

const citySelect = document.getElementById("citySelect");
const queryBtn   = document.getElementById("queryBtn");
const output     = document.getElementById("output");

/* 展示提示 / 空状态 */
function showTip(text, icon) {
  output.innerHTML =
    '<div class="tip fade-in">' + (icon ? '<span class="icon">' + icon + '</span>' : '') + text + '</div>';
}

/* 渲染天气卡片 */
function renderWeather(city, data) {
  const aqiClass = AQI_CLASS_MAP[data.aqiLevel] || "aqi-良";

  output.innerHTML = `
    <div class="weather-card fade-in">
      <div class="wc-top">
        <div>
          <div class="wc-city">${city}</div>
          <div class="wc-cond">${data.cond}</div>
          <div class="wc-temp-desc">数据更新于 今天 08:00</div>
        </div>
        <div class="wc-right">
          <div class="wc-icon">${data.icon}</div>
          <div class="wc-temp">${data.temp}<span>℃</span></div>
        </div>
      </div>

      <div class="wc-grid">
        <div class="wc-item">
          <div class="label">湿度</div>
          <div class="value">${data.humidity}<small>%</small></div>
        </div>
        <div class="wc-item">
          <div class="label">风力</div>
          <div class="value" style="font-size:15px;">${data.wind}</div>
        </div>
        <div class="wc-item">
          <div class="label">空气质量</div>
          <div class="badge ${aqiClass}">${data.aqiLevel} ${data.aqi}</div>
        </div>
      </div>
    </div>
  `;
}

/* 查询逻辑 */
function queryWeather() {
  const city = citySelect.value;

  if (!city) {
    showTip("请先选择一个城市", "📍");
    return;
  }

  const data = WEATHER_DATA[city];
  if (!data) {
    showTip("暂无「" + city + "」的天气数据", "🤔");
    return;
  }

  // 重置动画：先淡出再淡入
  output.innerHTML = "";
  requestAnimationFrame(() => renderWeather(city, data));
}

/* 事件绑定 */
queryBtn.addEventListener("click", queryWeather);

// 回车 / 切换选项后可直接查询，提升使用体验
citySelect.addEventListener("change", () => {
  if (citySelect.value) queryWeather();
});

/* 初始空状态 */
showTip("选择城市后点击「查询天气」", "🌍");
</script>

</body>
</html>
